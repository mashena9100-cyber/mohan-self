
workflows:
  android-build:
    name: MOHAN Android Build
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.mohan.self"
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
